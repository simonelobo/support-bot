    function askBot() {
    const q = document.getElementById('question').value;
    const resDiv = document.getElementById('response');
    const scriptUrl = "https://script.google.com/macros/s/AKfycbxU9uvcF1A9RCud6w7BlBas5WTCgaNyhOhJSJXOZScrU61HAqK9qAGsiuWt8vFz9mEnEQ/exec"; // Your /exec URL

    if (!q) return;
    resDiv.innerText = "Consulting knowledge base...";

    // 1. Create a unique callback name
    const callbackName = 'botCallback_' + Math.floor(Math.random() * 1000000);

    // 2. Define the function the Google Script will call
    window[callbackName] = function(data) {
        resDiv.innerHTML = `<strong>Answer:</strong><br>${data.answer}`;
        
        // Cleanup: remove the script tag and the function
        document.getElementById(callbackName).remove();
        delete window[callbackName];
    };

    // 3. Inject the script tag to trigger the request
    const script = document.createElement('script');
    script.id = callbackName;
    script.src = `${scriptUrl}?q=${encodeURIComponent(q)}&callback=${callbackName}`;
    
    // This handles errors like the script not loading
    script.onerror = () => {
        resDiv.innerText = "Access Denied: Your organization requires you to be logged into Google in this browser tab.";
    };

    document.body.appendChild(script);
}
