<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Engine</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f7f6; }
        .chat-container { width: 400px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
        #response { margin-top: 20px; line-height: 1.5; color: #333; font-size: 14px; padding: 10px; background: #f9f9f9; border-radius: 5px; min-height: 50px; }
    </style>
</head>
<body>

<div class="chat-container">
    <h3>Customer Support</h3>
    <p style="font-size: 12px; color: #666;">I'll check our docs first, then use AI if needed.</p>
    <input type="text" id="question" placeholder="Ask me anything...">
    <button id="sendBtn" onclick="askBot()">Ask Question</button>
    <div id="response">Your answer will appear here...</div>
</div>

<script>
    async function askBot() {
        const q = document.getElementById('question').value;
        const btn = document.getElementById('sendBtn');
        const resDiv = document.getElementById('response');

        if (!q) return alert("Please type a question.");

        btn.disabled = true;
        resDiv.innerText = "Searching knowledge base...";

        // Replace with your actual Google Web App URL
        const scriptUrl = "https://script.google.com/macros/s/AKfycbzs1Wa9z_A3CEF_4-XeJ6xzp9w_gnLxhMFnujtaoxD-USuPfJQpQ2tBtpvpSFOgrwWMWg/exec"; 

        try {
            const response = await fetch(`${scriptUrl}?q=${encodeURIComponent(q)}`);
            const data = await response.json();
            resDiv.innerHTML = `<strong>Answer:</strong><br>${data.answer}`;
        } catch (error) {
            resDiv.innerText = "Error connecting to server. Check console.";
            console.error(error);
        } finally {
            btn.disabled = false;
        }

</script>

</body>
</html>
